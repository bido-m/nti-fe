<div class="w-full min-h-screen flex flex-col justify-center items-center px-4 bg-[#0B0F19] text-center text-white">
  <span class="text-7xl sm:text-9xl font-black luxury-text-gradient select-none leading-none">404</span>
  <div class="w-16 h-1 bg-[#D4AF37] my-6 rounded-full"></div>
  <p class="text-2xl sm:text-3xl font-extrabold text-white">Vault Reference Not Found</p>
  <p class="text-slate-400 text-xs sm:text-sm mt-2 max-w-sm">
    The piece or private page you are seeking does not exist or has been relocated to another collection.
  </p>
  <div class="flex gap-4 mt-8 flex-wrap justify-center">
    <a
      routerLink="/"
      class="px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider text-black bg-[#D4AF37] hover:bg-[#b8952b] transition shadow-lg shadow-[#D4AF37]/20"
    >
      Return to Home
    </a>
    <button
      (click)="goBack()"
      class="px-6 py-3 rounded-xl font-semibold text-xs text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 transition cursor-pointer"
    >
      Previous Page
    </button>
  </div>
