<div class="min-h-screen bg-gray-50 pt-24 pb-16 px-4 max-w-3xl mx-auto">
  <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8 sm:p-12">
    <div class="mb-8">
      <span class="text-xs uppercase font-bold tracking-widest text-[#D4AF37]">Management</span>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mt-1">Add New Product</h1>
      <p class="text-gray-500 text-sm mt-1">Enter luxury product specifications and details</p>
    </div>

    @if (successMessage) {
      <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl text-sm font-semibold">
        {{ successMessage }}
      </div>
    }

    @if (errorMessage) {
      <div class="mb-6 p-4 bg-red-50 border border-red-200 text-red-800 rounded-2xl text-sm font-semibold">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Product Title *</label>
        <input
          type="text"
          [(ngModel)]="title"
          name="title"
          required
          placeholder="e.g. Rolex Submariner Date"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Category *</label>
          <select
            [(ngModel)]="categoryId"
            name="categoryId"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm bg-white"
          >
            <option [ngValue]="null">Select Category</option>
            @for (cat of categories; track cat.id) {
              <option [ngValue]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Price (USD) *</label>
          <input
            type="number"
            [(ngModel)]="price"
            name="price"
            required
            placeholder="e.g. 14500"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Stock Quantity</label>
          <input
            type="number"
            [(ngModel)]="stock"
            name="stock"
            placeholder="10"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Image URL</label>
          <input
            type="url"
            [(ngModel)]="imageUrl"
            name="imageUrl"
            placeholder="https://..."
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Description</label>
        <textarea
          [(ngModel)]="description"
          name="description"
          rows="4"
          placeholder="Detailed description of craftsmanship, materials, and features..."
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#D4AF37] focus:outline-none text-sm"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-4 pt-4">
        <a routerLink="/products" class="px-6 py-3 rounded-full text-xs font-bold border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="isSubmitting"
          class="px-8 py-3 rounded-full text-xs font-bold bg-[#D4AF37] hover:bg-[#b8952b] text-black transition shadow-md cursor-pointer disabled:opacity-50"
        >
          {{ isSubmitting ? 'Saving...' : 'Add Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
